name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@c8e77b72cd6022852162c92aa10e7e72b7209c9b # v2
              with:
                  version: 12.3.4
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify types, lint, and SQLite contracts
              run: npm run verify

            - name: Verify package consumer
              run: npm run package:smoke

            - name: Verify release metadata and supply chain
              run: |
                  npm run pack:check
                  npm run security:scan
                  npm run sbom
                  npm run release:check:metadata

            - name: Upload CycloneDX SBOM
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: sbom
                  path: artifacts/sbom.cdx.json
                  if-no-files-found: error
