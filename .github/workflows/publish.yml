name: Publish Package

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to retry
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        environment: npm

        steps:
            - name: Resolve immutable release ref
              id: release-ref
              shell: bash
              run: |
                  requested_ref="${{ inputs.tag || github.ref_name }}"
                  release_ref="${requested_ref%%+publish.*}"
                  if [[ ! "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
                      echo "Unsupported release ref: $requested_ref" >&2
                      exit 1
                  fi
                  echo "ref=$release_ref" >> "$GITHUB_OUTPUT"

            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  ref: ${{ steps.release-ref.outputs.ref }}

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@c8e77b72cd6022852162c92aa10e7e72b7209c9b # v2
              with:
                  version: 12.3.4
                  runtime: node@22
                  cache: false
                  install: false

            - name: Install trusted-publishing compatible npm
              run: npm install --global npm@11.19.1

            - name: Verify trusted-publishing runtime
              run: |
                  node --version
                  npm --version
                  test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
                  test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run strict release gate
              run: npm run release:verify

            - name: Upload CycloneDX SBOM
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: sbom-${{ github.ref_name }}
                  path: artifacts/sbom.cdx.json
                  if-no-files-found: error

            - name: Publish with npm trusted publishing
              run: npm publish --access public
